backend:
  name: github
  repo: makostin/fauna
  branch: main
  base_url: https://decap-cms-github-oauth-api.kostinmaks.workers.dev

i18n:
  structure: multiple_files
  locales: [ru]
  default_locale: ru

collections:
  # ────────────────────────────────────────────────
  # Suborder
  # ────────────────────────────────────────────────
  - name: "suborders"
    label: "Suborders"
    folder: "content/suborders"
    create: true
    i18n: true
    path: "{{fields.title | lower}}/index"
    slug: "{{fields.title | lower}}"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Suborder name"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Scientific name, e.g. Anisoptera"
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
            i18n: true
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"

  # ────────────────────────────────────────────────
  # Family — refers to Suborder
  # ────────────────────────────────────────────────
  - name: "families"
    label: "Families"
    folder: "content/families"
    create: true
    i18n: true
    path: "{{fields.title | lower}}/index"
    slug: "{{fields.title | lower}}"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Family name"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Scientific name, e.g. Aeshnidae"
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - label: "Suborder"
        name: "suborder"
        widget: "relation"
        collection: "suborders"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        required: true
        i18n: duplicate
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: true }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"

  # ────────────────────────────────────────────────
  # Genus — refers to Family
  # ────────────────────────────────────────────────
  - name: "genera"
    label: "Genera"
    folder: "content/genera"
    create: true
    i18n: true
    path: "{{fields.title | lower}}/index"
    slug: "{{fields.title | lower}}"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Genus name"
        name: "title"
        widget: "string"
        required: true
        i18n: duplicate
        hint: "Scientific name, e.g. Anax"
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - label: "Family"
        name: "family"
        widget: "relation"
        collection: "families"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        required: true
        i18n: duplicate
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: true }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"

  # ────────────────────────────────────────────────
  # Species — refers to Genus
  # ────────────────────────────────────────────────
  - name: "species"
    label: "Species"
    folder: "content/species"
    create: true
    i18n: true
    identifier_field: "species"
    summary: "{{fields.genus}} {{fields.species}} — {{fields.common_name}}"
    path: "{{fields.genus | lower}}-{{fields.species | lower}}/index"
    slug: "{{fields.genus | lower}}-{{fields.species | lower}}"
    media_folder: ""
    public_folder: ""
    fields:
      - label: "Genus"
        name: "genus"
        widget: "relation"
        collection: "genera"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        required: true
        i18n: duplicate
      - label: "Species epithet"
        name: "species"
        widget: "string"
        required: true
        i18n: duplicate
        pattern: ["^[a-z-]+$", "Lowercase only, by taxonomic convention"]
      - label: "Authority"
        name: "authority"
        widget: "string"
        required: true
        i18n: duplicate
      - label: "Common name"
        name: "common_name"
        widget: "string"
        required: true
        i18n: true
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: true }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"

  # ────────────────────────────────────────────────
  # Article — simple content type
  # ────────────────────────────────────────────────
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    i18n: true
    path: "{{slug}}/index"
    slug: "{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string", required: true, i18n: true }
      - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        i18n: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            i18n: duplicate
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false, i18n: true }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"
  # ────────────────────────────────────────────────
  # main page
  # ────────────────────────────────────────────────
  - name: "homepage"
    label: "Homepage"
    i18n: true
    files:
      - label: "Main page"
        name: "main"
        file: "content/_index.md"
        media_folder: ""
        public_folder: ""
        fields:
          - { label: "Title", name: "title", widget: "string", required: true, i18n: true }
          - { label: "Date", name: "date", widget: "datetime", i18n: duplicate }
          - { label: "Draft", name: "draft", widget: "boolean", default: true, i18n: duplicate }
          - label: "Hero Image"
            name: "hero"
            widget: "object"
            required: true
            i18n: true
            fields:
              - label: "File"
                name: "file"
                widget: "image"
                required: true
                i18n: duplicate
                media_library:
                  config:
                    multiple: false
              - { label: "Caption", name: "caption", widget: "string", required: false, i18n: true }
          - label: "Images"
            name: "images"
            widget: "list"
            required: false
            summary: "{{fields.id}} — {{fields.caption}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Used in body as {{< image THIS-ID >}}" }
              - label: "File"
                name: "file"
                widget: "image"
                media_library:
                  config:
                    multiple: false
              - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Body"
            name: "body"
            widget: "markdown"
            i18n: true
            hint: "To insert an image from the Images list above, type: {{< image the-id >}}"