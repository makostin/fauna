backend:
  name: github
  repo: makostin/fauna
  branch: main
  base_url: https://decap-cms-github-oauth-api.kostinmaks.workers.dev

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "species"
    label: "Species"
    folder: "content/species"
    create: true
    path: "{{scientific_name}}/index"        # forces the page-bundle layout: <slug>/index.md
    media_folder: ""              # upload images into the entry's own folder
    public_folder: ""             # …and reference them by bare filename
    slug: "{{scientific_name}}"
    fields:
      - label: "Hero Image"
        name: "hero"
        widget: "object"
        required: true
        fields:
          - label: "File"
            name: "file"
            widget: "image"
            required: true
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Suborder", name: "suborder", widget: "string" }
      - { label: "Family", name: "family", widget: "string" }
      - { label: "Genus", name: "genus", widget: "string" }
      - { label: "Species", name: "species", widget: "string" }
      - { label: "Scientific name", name: "scientific_name", widget: "string" }
      - { label: "Authority", name: "authority", widget: "string" }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.id}} — {{fields.caption}}"
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            hint: "Short, unique, no spaces. This is what you type in the body: {{< image THIS-ID >}}"
          - label: "File"
            name: "file"
            widget: "image"
            media_library:
              config:
                multiple: false
          - label: "Caption"
            name: "caption"
            widget: "string"
            required: false

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "To insert an image from the Images list above, type: {{< image the-id >}}"