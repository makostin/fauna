backend:
  name: github
  repo: makostin/fauna
  branch: main
  base_url: https://decap-cms-github-oauth-api.kostinmaks.workers.dev

media_folder: "public/images" # Where uploaded images are saved
public_folder: "/images"       # The path the browser uses to fetch images

collections:
  - name: "blog"               # Used in paths, routing, and relations (unique ID)
    label: "Blog Posts"        # The display title in the CMS sidebar UI
    folder: "content/blog" # Repository path where markdown files are stored
    create: true               # Allows content editors to write and publish new posts
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" # Format for the generated filename
    fields:                    # The actual form fields visible in the editor UI
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }